<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SPAM Meta has moved</title>
<meta name="robots" content="noindex">
<link rel="canonical" href="https://spam-meta.com/">
<script>
  (function () {
    var p = location.pathname.replace(new RegExp("^/spam-meta(/|$)"), "");
    location.replace("https://spam-meta.com/" + p + location.search + location.hash);
  })();
</script>
<noscript><meta http-equiv="refresh" content="0; url=https://spam-meta.com/"></noscript>
<style>
  body { margin: 0; padding: 48px 16px; background: #15112b; color: #ece9ff; font: 16px/1.5 system-ui, sans-serif; }
  a { color: #4fd4f5; }
</style>
</head>
<body>
<p>SPAM Meta has moved to <a href="https://spam-meta.com/">spam-meta.com</a>.</p>
<p lang="fr">SPAM Meta a déménagé sur <a href="https://spam-meta.com/">spam-meta.com</a>.</p>
</body>
</html>
